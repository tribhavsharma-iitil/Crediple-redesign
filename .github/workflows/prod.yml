name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    outputs:
      build-version: ${{ steps.version.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload Next.js artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-${{ steps.version.outputs.sha }}
          path: .next/
          retention-days: 7

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Download Next.js artifact
        uses: actions/download-artifact@v4
        with:
          name: next-${{ needs.build.outputs.build-version }}
          path: .next/

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify downloaded files
        run: ls -la .next

      - name: Upload Next.js build to S3
        run: |
          aws s3 sync .next/ s3://${{ vars.AWS_S3_BUCKET }}/ \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_ID }} \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "### Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ needs.build.outputs.build-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Bucket: s3://${{ vars.AWS_S3_BUCKET }}" >> $GITHUB_STEP_SUMMARY
